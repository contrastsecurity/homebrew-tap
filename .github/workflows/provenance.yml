name: provenance

# Checks that a contrast-cli formula change only moves the formula to the latest
# published release, with the checksums Artifactory serves for it.
on:
  pull_request:
    paths:
      - Formula/contrast-cli.rb

permissions:
  contents: read

env:
  BASE_URL: https://pkg.contrastsecurity.com/artifactory/pathfinder-beta-distro/contrast-cns

jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check that only version and checksum lines changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Three dots diff against the merge base, so commits that landed on the base since don't count
          changed="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          if [ "$changed" != "Formula/contrast-cli.rb" ]; then
            echo "::error::only Formula/contrast-cli.rb may change, but the PR changes: ${changed//$'\n'/ }"
            exit 1
          fi
          diff="$(git diff -U0 "$BASE_SHA...$HEAD_SHA" -- Formula/contrast-cli.rb)"
          bad="$(grep -E '^[-+]' <<<"$diff" | grep -vE '^(--- a/|\+\+\+ b/)' | cut -c2- \
            | grep -vE '^  version "[0-9]+\.[0-9]+\.[0-9]+"$|^      sha256 "[0-9a-f]{64}"$' || true)"
          if [ -n "$bad" ]; then
            echo "::error::lines other than version and sha256 changed:"
            echo "$bad"
            exit 1
          fi

      - name: Check the version is the latest published release
        id: version
        run: |
          set -euo pipefail
          version="$(sed -n 's/^  version "\(.*\)"$/\1/p' Formula/contrast-cli.rb)"
          latest="$(curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors "$BASE_URL/latest-version.txt" \
            | sed -n 's/^VERSION=//p' | tr -d '[:space:]')"
          if [ -z "$version" ] || [ "$version" != "$latest" ]; then
            echo "::error::formula version '${version}' is not the latest published release '${latest}'"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Check checksums against Artifactory
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          failed=0
          for platform in darwin-arm64 darwin-amd64 linux-arm64 linux-amd64; do
            archive="contrast-cns-${platform}.tar.gz"
            formula_sum="$(ARCHIVE="$archive" perl -0ne \
              'print $1 if /\Q$ENV{ARCHIVE}\E"\n\s*sha256 "([0-9a-f]{64})"/' Formula/contrast-cli.rb)"
            served_sum="$(curl -fsSI --retry 5 --retry-delay 10 --retry-all-errors "$BASE_URL/$VERSION/$archive" \
              | tr -d '\r' | awk -F': ' 'tolower($1) == "x-checksum-sha256" { print $2 }')"
            if [ -z "$formula_sum" ] || [ "$formula_sum" != "$served_sum" ]; then
              echo "::error::${archive}: formula has '${formula_sum}', Artifactory serves '${served_sum}'"
              failed=1
            else
              echo "${archive} ${formula_sum}"
            fi
          done
          exit "$failed"
