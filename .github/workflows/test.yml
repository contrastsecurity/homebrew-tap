name: test

on:
  pull_request:

permissions:
  contents: read

jobs:
  check-formula-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the formula diff gate
        run: tests/check-formula-diff.sh
