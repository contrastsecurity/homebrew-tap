name: smoke

# Installs contrast-cli from the tap the way users do and checks it runs the formula's version.
on:
  push:
    branches:
      - master
    paths:
      - Formula/contrast-cli.rb
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke
  cancel-in-progress: false

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Install contrast-cli and check its version
        run: |
          set -euo pipefail
          if ! command -v brew >/dev/null; then
            # Ubuntu runners ship Homebrew without putting it on PATH
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          brew tap contrastsecurity/tap
          brew install contrast-cli || { echo "::warning::brew install failed, retrying once"; sleep 30; brew install contrast-cli; }
          # Read from the tapped formula, which is what brew installed, in case master moved past this push
          expected="$(sed -n 's/^  version "\(.*\)"$/\1/p' "$(brew --repository contrastsecurity/tap)/Formula/contrast-cli.rb")"
          actual="$(contrast-cli --version)"
          if [ -z "$expected" ] || [ "$actual" != "$expected" ]; then
            echo "::error::contrast-cli --version printed '${actual}', expected '${expected}'"
            exit 1
          fi
          echo "contrast-cli ${actual}"
